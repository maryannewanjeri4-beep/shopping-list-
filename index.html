<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section>
        <h1>SHOPPING LIST</h1>

        <div class="myform">
          <form id="shopping-form">
            <div class="form-group">
              <label for="item">Item:</label>
              <input type="text" id="item" name="item" placeholder="Eggs" required />
            </div>

            <div class="form-group">
              <label for="price">Price:</label>
              <input type="number" id="price" name="price" placeholder="15" required />
            </div>

            <div class="form-group">
              <label for="quantity">Quantity:</label>
              <input type="number" id="quantity" name="quantity" placeholder="1" required />
            </div>

            <button type="submit">Add Item</button>
          </form>
        </div>

        <h3>YOUR CURRENT LIST</h3>
        <ul id="List-container"></ul>

        <div class="action-buttons">
          <button type="button" id="mark-purchased-btn">Mark as purchased</button>
          <button type="button" id="clear-list-btn">Clear List</button>
        </div>

        <div class="summary-box">
          <div><span id="total-selected">KSh 0.00</span> Selected</div>
          <div><span id="total-purchased">KSh 0.00</span> Purchased</div>
          <div><span id="total-whole">KSh 0.00</span> Whole list</div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
